
config_file:
  name_file: "config.yaml"
  loader: "loader.js"

packages:
  - crypto_package:
    typ: "folder"
    enable: true
    patch: "pacage/crypto_package"
    title: "Този раздел представлява папка с пакети за криптиране, декодиране, шифроване и тяхните компоненти. Разделенията са логически разделени на подпапки и файлове, които съдържат различни алгоритми и методи за криптографска обработка на данни. Всеки пакет има свои собствени настройки и компоненти, които могат да бъдат активирани или деактивирани според нуждите на потребителя."
    theme:
      - "Криптография"
      - "Сигурност"
      - "Шифроване"
      - "Хеширане"
    package:
      - CRC_sum:
        typ: "folder"
        enable: true
        title: "Този раздел представлява подпапка която съдържа контролните и заедно с имената на пакета."
        manifest_file:
          - enable: false
          - patch: "./manifest/valueas_algorithmus.json"
          - title: "Манифеста е комбинация от полулярно прилаганите манифести към проекти."
      - encrypt:
        typ: "folder"
        enable: true
        title:
        manifest_file:
          - enable: false
          - patch:
      - ots:
        enable: true
        title:
        manifest_file:
          - enable: false
          - patch:
        components:
          index:
            - ots-cli.js
          timestamp:
            - detached-timestamp-file.js
            - open-timestamps.js
            - timestamp.js
          server:
            - bitcoin.js
            - calendar.js
            - context.js
          settings:
            - esplora.js
            - extend-error.js
            - merkle.js
            - notary.js
            - ops.js
            - utils.js
      - pgp:
        enable: true
        title:
        manifest_file:
          - enable: false
          - patch:
  - language:
    typ: "folder"
    language_pack:
      - BG:
        type: "json"
        file_name: "bg.json"
      - DE:





