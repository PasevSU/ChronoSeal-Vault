configuration:
  evidence_root:
    name: Папка за доказателствени кейсове
    description: Основна папка за forensic evidence кейсовете. Трябва да е под /data или /share.
  import_root:
    name: Папка за вход/импорт
    description: Папка за файлове, подготвени за импорт в ChronoSeal Vault.
  export_root:
    name: Папка за копия/експорт
    description: Дестинация за независимо хеш-проверени копия на запечатаните кейсове.
  staging_root:
    name: Временна staging папка
    description: Временна папка за streaming и атомарно приемане на файлове. Препоръчително /data/staging.
  auto_export_copy:
    name: Автоматично копиране след запечатване
    description: След успешна физическа проверка на seal-а създава проверено копие в export папката.
  copy_original_to_export:
    name: Копирай и оригинала
    description: Включва immutable оригиналния файл в провереното export копие.
  import_recursive:
    name: Рекурсивно сканиране при импорт
    description: Сканира и подпапките на зададената директория за импорт.
  max_upload_mib:
    name: Максимален размер на доказателство (MiB)
    description: Отказва качвания и импорти над зададения лимит.
  java_ots_jar:
    name: Външен Java OpenTimestamps verifier
    description: Незадължителен OtsCli.jar под /share или /data за независима OTS проверка.
  java_ots_sha256:
    name: SHA-256 на Java OTS verifier
    description: Задължителен 64-символен SHA-256, ако OtsCli.jar ще се изпълнява. Без pin JAR файлът не се стартира.
